name: Refresh Lodestone event data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: pip install -r EorzeaEventTracker/collector/requirements.txt
      - name: Test collector and official image URL contract
        run: python -m unittest discover -s tests -v
        working-directory: EorzeaEventTracker
      - name: Test client feed and image URL contract
        run: dotnet run --project tests/FeedChecks/FeedChecks.csproj -c Release
        working-directory: EorzeaEventTracker
      - run: cp config/events.json "$RUNNER_TEMP/previous-events.json"
        working-directory: EorzeaEventTracker
      - run: python collector/collect.py --output config/events.json
        working-directory: EorzeaEventTracker
      - name: Validate quest, NPC, map and shop relationships
        run: python collector/validate.py --input config/events.json --previous "$RUNNER_TEMP/previous-events.json" --report config/validation-report.json
        working-directory: EorzeaEventTracker
      - run: dotnet run --project tests/FeedChecks/FeedChecks.csproj -c Release -- --validate config/events.json
        working-directory: EorzeaEventTracker
      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: event-collection-report
          path: |
            EorzeaEventTracker/config/collection-report.json
            EorzeaEventTracker/config/validation-report.json
          if-no-files-found: ignore
      - name: Commit updates
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EorzeaEventTracker/config/events.json EorzeaEventTracker/config/translation-cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh event data'
            # workflow_dispatch/scheduled runs can be queued at an older SHA
            # while the preceding release updates pluginmaster.json.
            for attempt in 1 2 3 4 5; do
              echo "Publish attempt $attempt/5"
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
