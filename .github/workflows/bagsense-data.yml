name: Update BagSense database
on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * *'
permissions:
  contents: write
concurrency:
  group: dalamud-publish
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector rules
        run: python -m unittest discover -s BagSense/tests -p test_database.py -v
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bagsense-sources
          key: bagsense-sources-${{ github.run_id }}
          restore-keys: bagsense-sources-
      - name: Collect complete catalog
        run: python BagSense/tools/collect_database.py --output BagSense/data --cache '${{ runner.temp }}/bagsense-sources'
      - name: Publish validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BagSense/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update BagSense item and quest database'
          git pull --rebase origin main
          git push origin HEAD:main
