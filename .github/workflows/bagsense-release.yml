name: Release BagSense
on:
  push:
    tags: ['bs-v*']
permissions:
  contents: write
concurrency:
  group: dalamud-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test shared repository publisher
        run: |
          python -m unittest discover -s EorzeaEventTracker/tests -p test_repository.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Repository index tests failed' }
          python -m unittest discover -s BagSense/tests -p test_release.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Package verifier tests failed' }
      - name: Install Dalamud development files
        run: |
          $directory = Join-Path $env:APPDATA 'XIVLauncher/addon/Hooks/dev'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" -DestinationPath $directory -Force
      - name: Build, test and validate package
        run: |
          ./BagSense/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'BagSense build failed' }
          dotnet run --project BagSense/tools/ApiProbe/ApiProbe.csproj -c Release -- --configuration
          if ($LASTEXITCODE -ne 0) { throw 'Configuration persistence checks failed' }
          Copy-Item BagSense/artifacts/BagSense.zip "$env:RUNNER_TEMP/BagSense.zip"
          Copy-Item BagSense/artifacts/BagSense.zip.sha256 "$env:RUNNER_TEMP/BagSense.zip.sha256"
          Copy-Item BagSense/BagSense/bin/Release/BagSense.json "$env:RUNNER_TEMP/BagSense.json"
          Copy-Item pluginmaster.json "$env:RUNNER_TEMP/pluginmaster.json"
          python tools/update_repository.py --index "$env:RUNNER_TEMP/pluginmaster.json" --manifest "$env:RUNNER_TEMP/BagSense.json" --repository $env:RELEASE_REPO --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release metadata' }
          python BagSense/tools/verify_package.py --zip "$env:RUNNER_TEMP/BagSense.zip" --checksum "$env:RUNNER_TEMP/BagSense.zip.sha256" --tag $env:RELEASE_TAG --repository $env:RELEASE_REPO --index "$env:RUNNER_TEMP/pluginmaster.json"
          if ($LASTEXITCODE -ne 0) { throw 'Package / index verification failed' }
      - name: Publish release asset
        run: |
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO --json tagName > $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG "$env:RUNNER_TEMP/BagSense.zip" "$env:RUNNER_TEMP/BagSense.zip.sha256" --repo $env:RELEASE_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG "$env:RUNNER_TEMP/BagSense.zip" "$env:RUNNER_TEMP/BagSense.zip.sha256" --verify-tag --repo $env:RELEASE_REPO --title "BagSense $env:RELEASE_TAG" --notes-file BagSense/RELEASE-NOTES.md --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Add released plugin to custom repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'Fetch failed' }
            git checkout -B main origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
            python tools/update_repository.py --manifest "$env:RUNNER_TEMP/BagSense.json" --repository $env:RELEASE_REPO --tag $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'Index update failed' }
            python BagSense/tools/verify_package.py --zip "$env:RUNNER_TEMP/BagSense.zip" --tag $env:RELEASE_TAG --repository $env:RELEASE_REPO --index pluginmaster.json
            if ($LASTEXITCODE -ne 0) { throw 'Published index verification failed' }
            git add pluginmaster.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git commit -m "Release BagSense $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Index commit failed' }
            git push origin main
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw 'Index push failed after three attempts'
