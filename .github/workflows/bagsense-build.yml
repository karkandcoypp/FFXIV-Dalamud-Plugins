name: BagSense build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['BagSense/**', '.github/workflows/bagsense-build.yml']
  pull_request:
    paths: ['BagSense/**', '.github/workflows/bagsense-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Download official Dalamud development libraries
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          $directory = Join-Path $env:APPDATA 'XIVLauncher/addon/Hooks/dev'
          Expand-Archive -LiteralPath dalamud.zip -DestinationPath $directory
          "DALAMUD_HOME=$directory" >> $env:GITHUB_ENV
      - name: Build, check and package
        shell: pwsh
        run: ./BagSense/build.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: BagSense
          path: |
            BagSense/artifacts/BagSense.zip
            BagSense/artifacts/BagSense.zip.sha256
