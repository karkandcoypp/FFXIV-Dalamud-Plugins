name: Build Eorzea Compass preview
on:
  workflow_dispatch:
  push:
    paths: ['EorzeaCompass/**', '.github/workflows/compass-build.yml']
  pull_request:
    paths: ['EorzeaCompass/**', '.github/workflows/compass-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Dalamud development files
        shell: pwsh
        run: |
          $directory = Join-Path $env:APPDATA 'XIVLauncher/addon/Hooks/dev'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" -DestinationPath $directory -Force
      - name: Test progress resolver and build
        shell: pwsh
        run: |
          dotnet run --project EorzeaCompass/tests/CompassChecks/CompassChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compass checks failed' }
          dotnet build EorzeaCompass/EorzeaCompass/EorzeaCompass.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Compass build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: EorzeaCompass-preview
          path: EorzeaCompass/EorzeaCompass/bin/Release/EorzeaCompass/latest.zip
          if-no-files-found: error
