name: Release Ultrawide Cutscenes
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag matching the current manifest; validation only, no publication"
        required: true
        type: string
  push:
    tags: ['uc-v*']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test shared publication helpers
        run: |
          python -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Publication helper tests failed' }
      - name: Install Dalamud development files
        run: |
          $directory = Join-Path $env:APPDATA 'XIVLauncher/addon/Hooks/dev'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" -DestinationPath $directory -Force
      - name: Build plugin
        run: |
          dotnet build UltrawideCutscenes/Dalamud.FullscreenCutscenes.sln -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $output = 'UltrawideCutscenes/Dalamud.FullscreenCutscenes/bin/x64/Release'
          Copy-Item "$output/Dalamud.FullscreenCutscenes.Community/latest.zip" "$env:RUNNER_TEMP/UltrawideCutscenes.zip"
          Copy-Item "$output/Dalamud.FullscreenCutscenes.Community.json" "$env:RUNNER_TEMP/UltrawideCutscenes.json"
          Copy-Item pluginmaster.json "$env:RUNNER_TEMP/pluginmaster.json"
          python tools/update_repository.py --index "$env:RUNNER_TEMP/pluginmaster.json" --manifest "$env:RUNNER_TEMP/UltrawideCutscenes.json" --repository $env:RELEASE_REPO --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release metadata' }
          python tools/verify_release.py --zip "$env:RUNNER_TEMP/UltrawideCutscenes.zip" --manifest "$env:RUNNER_TEMP/UltrawideCutscenes.json" --repository $env:RELEASE_REPO --tag $env:RELEASE_TAG --index "$env:RUNNER_TEMP/pluginmaster.json"
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - name: Upload validation package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: validated-uc-package
          path: |
            ${{ runner.temp }}/UltrawideCutscenes.zip
            ${{ runner.temp }}/UltrawideCutscenes.json
            ${{ runner.temp }}/pluginmaster.json
          if-no-files-found: error
      - name: Publish release asset
        if: github.event_name == 'push'
        run: ./tools/publish_asset.ps1 -Archive "$env:RUNNER_TEMP/UltrawideCutscenes.zip" -Manifest "$env:RUNNER_TEMP/UltrawideCutscenes.json" -Notes "UltrawideCutscenes/RELEASE-NOTES.md"
      - name: Update shared plugin repository
        if: github.event_name == 'push'
        run: |
          python tools/publish_index.py --manifest "$env:RUNNER_TEMP/UltrawideCutscenes.json" --repository $env:RELEASE_REPO --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Index publication failed after retries' }
