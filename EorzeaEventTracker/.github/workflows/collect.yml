name: Refresh Lodestone event data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */12 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: pip install -r EorzeaEventTracker/collector/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: EorzeaEventTracker
      - run: python collector/collect.py --output config/events.json
        working-directory: EorzeaEventTracker
      - run: dotnet run --project tests/FeedChecks/FeedChecks.csproj -c Release -- --validate config/events.json
        working-directory: EorzeaEventTracker
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EorzeaEventTracker/config/events.json
          git diff --cached --quiet || (git commit -m 'Refresh event data' && git push)
